name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install '.[all,test]'
      - name: Prepare native libarchive on Windows
        run: |
          python snug_runtime.py --windows-repair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIBARCHIVE=$PWD\native\libarchive-13.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile and test
        run: |
          python -m compileall -q snug.py snug_core.py snug_ext.py snug_runtime.py snug_update.py tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
      - name: Verify live embedded bootstrap and DLL repair separately
        if: matrix.python == '3.14'
        env:
          SNUG_WINDOWS_LIVE_BOOTSTRAP: '1'
        run: python -m pytest -q tests/test_windows_runtime.py::test_windows_bootstrap_password_workflow_and_deleted_dll_repair
      - name: Type check
        if: matrix.python == '3.14'
        run: npx --yes pyright@1.1.414
      - name: Build and check release contents
        if: matrix.python == '3.14'
        run: |
          python -m pip install build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_release.py dist
      - name: Verify the installed wheel outside the checkout
        if: matrix.python == '3.14'
        run: |
          $WheelRoot = Join-Path $env:RUNNER_TEMP 'snug-wheel'
          python -m venv $WheelRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $WheelPython = Join-Path $WheelRoot 'Scripts/python.exe'
          $Snug = Join-Path $WheelRoot 'Scripts/snug.exe'
          $Wheel = (Get-ChildItem -LiteralPath dist -Filter *.whl).FullName
          & $WheelPython -m pip install --no-deps $Wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $SmokeRoot = Join-Path $env:RUNNER_TEMP 'snug wheel smoke'
          New-Item -ItemType Directory -Path $SmokeRoot | Out-Null
          Set-Location $SmokeRoot
          $env:SNUG_NO_UPDATE_CHECK = '1'
          $Source = Join-Path $SmokeRoot 'payload with spaces.txt'
          Set-Content -LiteralPath $Source -Value 'installed wheel payload' -Encoding utf8
          & $Snug --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Snug create smoke.zip $Source
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Snug list smoke.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Snug info smoke.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $Snug extract smoke.zip -C smoke-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Restored = Join-Path $SmokeRoot 'smoke-output/payload with spaces.txt'
          if ((Get-FileHash -LiteralPath $Source).Hash -ne (Get-FileHash -LiteralPath $Restored).Hash) {
            throw 'Installed wheel round trip changed the payload.'
          }
