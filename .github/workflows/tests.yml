name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install '.[all,test]'
      - name: Install native libarchive on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev
      - name: Install native libarchive on macOS
        if: runner.os == 'macOS'
        run: brew install libarchive
      - name: Compile and test
        run: |
          python -m compileall -q snug.py snug_core.py snug_ext.py snug_update.py snug_runtime.py tests
          python -m pytest -q
      - name: Type check
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: npx --yes pyright@1.1.414
      - name: Build and check release contents
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          python -m pip install build
          python -m build
          python scripts/check_release.py dist
      - name: Verify the installed wheel outside the checkout
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        shell: bash
        run: |
          export SNUG_NO_UPDATE_CHECK=1
          python -m venv "$RUNNER_TEMP/snug-wheel"
          "$RUNNER_TEMP/snug-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/snug-wheel/bin/snug" --version
          "$RUNNER_TEMP/snug-wheel/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_cli.py"
          "$RUNNER_TEMP/snug-wheel/bin/snug" create smoke.zip "$GITHUB_WORKSPACE/tests"
          "$RUNNER_TEMP/snug-wheel/bin/snug" list smoke.zip
          "$RUNNER_TEMP/snug-wheel/bin/snug" info smoke.zip
          "$RUNNER_TEMP/snug-wheel/bin/snug" extract smoke.zip -C smoke-output
      - name: Verify a fresh editable installation outside the checkout
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/snug-editable"
          "$RUNNER_TEMP/snug-editable/bin/python" -m pip install --no-deps -e "$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/snug-editable/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_cli.py"
