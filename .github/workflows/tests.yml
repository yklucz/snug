name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install '.[all,test]'
      - name: Install native libarchive on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-dev
      - name: Install native libarchive on macOS
        if: runner.os == 'macOS'
        run: brew install libarchive
      - name: Prepare native libarchive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python snug_runtime.py --windows-repair
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIBARCHIVE=$PWD\native\libarchive-13.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile and test
        run: |
          python -m compileall -q snug.py snug_core.py snug_ext.py snug_runtime.py tests
          python -m pytest -q
